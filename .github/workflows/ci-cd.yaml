name: CI/CD

on:
  - push
  - pull_request

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: test

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: run tests
        run: cargo test --locked --all-features --all-targets

  test-docs:
    name: test docs

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: run doc tests
        run: cargo test --locked --doc --all-features

  check:
    name: check

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: install rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: check code
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  check-docs:
    name: check docs

    runs-on: ubuntu-latest

    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: install rust
        uses: dtolnay/rust-toolchain@nightly

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: check documentation
        run: cargo doc --locked --workspace --all-features --no-deps

  check-nix:
    name: check nix

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: setup nix
        uses: ./.github/actions/setup-nix

      - name: check flake
        run: nix flake check

  check-format:
    name: check format

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: setup nix
        uses: ./.github/actions/setup-nix

      # treefmt owns the Rust, Nix, and TOML formatting configuration.
      - name: check formatting
        run: nix build .#checks.x86_64-linux.treefmt

  build:
    name: build

    permissions:
      actions: write
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    needs:
      - test
      - test-docs
      - check
      - check-docs
      - check-nix
      - check-format

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: generate Docker metadata
        id: docker-metadata
        uses: docker/metadata-action@v5
        with:
          images: us-east1-docker.pkg.dev/vidhan-io/site/site
          tags: |
            type=ref,event=branch
            type=sha
          flavor: |
            latest=true

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to Google Cloud
        id: gcloud-auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcloud-auth.outputs.access_token }}

      - name: build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy

    permissions:
      contents: read
      id-token: write

    environment:
      name: production
      url: https://vidhan.io

    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: login to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: site
          image: us-east1-docker.pkg.dev/vidhan-io/site/site:latest
          env_vars: |
            IP=0.0.0.0
            PRODUCTION=true
          region: us-east1
