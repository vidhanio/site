[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "AGPL-3.0-only",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OFL-1.1",
  "OpenSSL",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.clarify]]
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
name = "ring"

[advisories]
# These advisories currently come from Typst's transitive font, PDF, and
# metadata parsers. There is no compatible upstream replacement yet.
ignore = [
  "RUSTSEC-2024-0320", # yaml-rust, pulled by Typst's syntax highlighter
  "RUSTSEC-2024-0436", # paste, pulled by Typst's compiler
  "RUSTSEC-2025-0141", # bincode, pulled by Typst's compiler
  "RUSTSEC-2026-0192", # ttf-parser, pulled by Typst's font stack
  "RUSTSEC-2026-0194", # quick-xml, pulled by Typst's bibliography stack
  "RUSTSEC-2026-0195", # quick-xml, pulled by Typst's bibliography stack
  "RUSTSEC-2026-0206", # rustybuzz, pulled by Typst's font stack
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/vidhanio/hypertext"]
