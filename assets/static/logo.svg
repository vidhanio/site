<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="128" height="128">
    <style>
        .bg {
            fill:
            /*{light.bg}*/
            ;
        }

        .fg {
            fill:
            /*{light.fg}*/
            ;
        }

        @media (prefers-color-scheme: dark) {
            .bg {
                fill:
                /*{dark.bg}*/
                ;
            }

            .fg {
                fill:
                /*{dark.fg}*/
                ;
            }
        }
    </style>
    <rect class="fg" x="0" y="0" width="100%" height="100%" />
    <rect class="bg" x="10%" y="10%" width="80%" height="80%" />
